name: "macOS Release Build"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.1
          releaseName: 'Project.txt v0.1.1'
          releaseBody: 'Gatekeeper Hotfix: Added Ad-Hoc signing and Ditto compression to address integrity issues.'
          releaseDraft: true
          prerelease: false

      - name: Fix Gatekeeper Integrity (Ad-Hoc & Ditto Zip)
        run: |
          # Find the app bundle
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          
          # Apply fresh ad-hoc signature
          codesign --force --deep --sign - "$APP_PATH"
          
          # Zip it using 'ditto' to preserve macOS-specific file attributes
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Project.txt_v0.1.1_macOS.zip
          
          # Upload the Zip to the new release
          gh release upload v0.1.1 Project.txt_v0.1.1_macOS.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}